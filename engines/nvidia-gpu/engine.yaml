name: nvidia-gpu
summary: CUDA-optimized for NVIDIA GPUs
description: |
  This engine uses llama.cpp with the CUDA backend, in embedding mode.

  It is optimized for NVIDIA GPUs.

  This engine supports both amd64 and arm64 CPU architectures.
vendor: amenezes.net

# No vram/compute-capability requirement on purpose: llama.cpp defaults to
# --fit on and --gpu-layers auto, so it offloads as many layers as fit in the
# GPU (partial offload included). Declaring a minimum VRAM would wrongly
# exclude GPUs that can run the model. Same choice as the sibling snaps.
devices:
  allof:
    - type: gpu
      vendor-id: 0x10de # Nvidia Corporation
  anyof:
    - type: cpu
      architecture: amd64
    - type: cpu
      architecture: arm64

runtime: llamacpp-cuda

model:
  default: qwen3-embedding-0-6b
  options:
    - qwen3-embedding-0-6b
    - qwen3-embedding-4b
    - qwen3-embedding-8b

configurations:
  sleep-idle-seconds: 600
  min-context-size: 4096
  # Physical batch size for prompt processing (llama-server --ubatch-size).
  # CPU measurements (ai/03 §3) made 512 the default; on GPU larger ubatches
  # can use the device more efficiently -- the vendor recommends 8192 for
  # maximum throughput. If VRAM allows:
  #   sudo qwen3-embedding set ubatch-size=8192 && sudo snap restart qwen3-embedding
  ubatch-size: 512
